<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Go Navigator">
  <title>Go Navigator</title>

  <!-- 圆形徽标底色 -->
  <circle cx="256" cy="256" r="210" fill="#05A9D0"/>

  <!-- 左侧接口标识 I -->
  <g fill="none" stroke="#10303E" stroke-width="10" stroke-linecap="round">
    <path d="M60 222 H106"/>
    <path d="M83 222 V298"/>
    <path d="M60 298 H106"/>
  </g>

  <!-- 右侧接口标识 {} -->
  <g fill="none" stroke="#10303E" stroke-width="7.5" stroke-linecap="round">
    <path d="M408 220 C397 220 393 227 393 238 L393 246 C393 253 389 256 382 256 C389 256 393 259 393 266 L393 274 C393 285 397 292 408 292"/>
    <path d="M428 220 C439 220 443 227 443 238 L443 246 C443 253 447 256 454 256 C447 256 443 259 443 266 L443 274 C443 285 439 292 428 292"/>
  </g>

  <!-- 循环箭头环 -->
  <g>
    <g fill="#10303E" stroke="#10303E">
      <path d="M112.28 197.94 A155 155 0 0 1 371.18 152.29" fill="none" stroke-width="44"/>
      <path d="M338.0 176.8 L411.3 196.9 L399.0 121.9 Z" stroke-width="15" stroke-linejoin="round"/>
    </g>
    <g fill="#FFFFFF" stroke="#FFFFFF">
