      <path d="M338.0 176.8 L411.3 196.9 L399.0 121.9 Z" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(180 256 256)">
      <g fill="#10303E" stroke="#10303E">
        <path d="M112.28 197.94 A155 155 0 0 1 371.18 152.29" fill="none" stroke-width="44"/>
        <path d="M338.0 176.8 L411.3 196.9 L399.0 121.9 Z" stroke-width="15" stroke-linejoin="round"/>
      </g>
      <g fill="#FFFFFF" stroke="#FFFFFF">
        <path d="M112.28 197.94 A155 155 0 0 1 371.18 152.29" fill="none" stroke-width="29"/>
        <path d="M338.0 176.8 L411.3 196.9 L399.0 121.9 Z" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 地鼠 -->
  <g>
    <!-- 头部 -->
    <path d="M256 166 C292 166 316 176 328 200 C340 224 346 244 346 264 C346 288 342 308 328 320 C314 332 292 334 256 334 C220 334 198 332 184 320 C170 308 166 288 166 264 C166 244 172 224 184 200 C196 176 220 166 256 166 Z"
