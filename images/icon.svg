    <!-- 耳朵 -->
    <circle cx="178" cy="192" r="20" fill="#4FCCDF" stroke="#10303E" stroke-width="5"/>
    <circle cx="334" cy="192" r="20" fill="#4FCCDF" stroke="#10303E" stroke-width="5"/>
    <circle cx="188" cy="200" r="6.5" fill="#10303E"/>
    <circle cx="324" cy="200" r="6.5" fill="#10303E"/>
    <!-- 眼睛 -->
    <circle cx="218" cy="222" r="24" fill="#FFFFFF" stroke="#10303E" stroke-width="5"/>
    <circle cx="294" cy="222" r="24" fill="#FFFFFF" stroke="#10303E" stroke-width="5"/>
    <circle cx="218" cy="224" r="11" fill="#10303E"/>
    <circle cx="294" cy="224" r="11" fill="#10303E"/>
    <!-- 口鼻 -->
    <ellipse cx="256" cy="262" rx="23" ry="11" fill="#D8AE8A" stroke="#10303E" stroke-width="4.5"/>
    <path d="M256 240 C264 240 271 245 271 250 C271 256 264 259 256 259 C248 259 241 256 241 250 C241 245 248 240 256 240 Z" fill="#10303E"/>
    <rect x="243" y="264" width="13" height="18" rx="4" fill="#FFFFFF" stroke="#10303E" stroke-width="4.5"/>
    <rect x="257" y="264" width="13" height="18" rx="4" fill="#FFFFFF" stroke="#10303E" stroke-width="4.5"/>
  </g>
